# =============================================================================
# PARÁMETROS IRPF — NÚCLEO ESTATAL (territorio común) — EJERCICIO 2026
# =============================================================================
# EN PREPARACIÓN. Hereda todo de params/2025/estatal.yaml; aquí solo va lo que cambia
# en 2026, con su norma y su fuente (BOE consolidado de la Ley 35/2006:
# https://www.boe.es/buscar/act.php?id=BOE-A-2006-20764, y normas de 2025-2026).
# Mientras un bloque no se haya cotejado para 2026 vale lo de 2025: por eso el
# ejercicio no está en `publicados` (params/ejercicios.yaml).
# =============================================================================

meta:
  jurisdiccion: estatal
  ejercicio: 2026
  regimen: comun
  hereda_de: "2025/estatal.yaml"
  estado_ejercicio: en_preparacion

# -----------------------------------------------------------------------------
# COMPROBADO SIN CAMBIOS PARA 2026 (se heredan de 2025)
# -----------------------------------------------------------------------------
# Cotejado el 27-09-2026 con el texto consolidado de la Ley 35/2006 en el BOE (última
# actualización, 09-09-2026). Ninguno de estos artículos tiene una redacción con efectos
# posteriores al 1-1-2025:
#   - escalas: arts. 63, 65, 66, 74 y 76 (general 19–47 %, ahorro 19–30 %);
#   - mínimo personal y familiar: arts. 56 a 61 (5.550 €, 2.400/2.700/4.000/4.500 €...);
#   - trabajo: art. 19.2 f) (2.000 €) y art. 20 (7.302 € hasta 14.852 €, redacción del
#     RDL 4/2024), y reducción por irregularidad del art. 18.2;
#   - previsión social: arts. 51.6 y 52.1 (1.500 € + 8.500 €, 30 %);
#   - tributación conjunta (art. 84.2), deducciones de los arts. 68, 81 y 81 bis, y
#     obligación de declarar (art. 96: 22.000 / 15.876 / 1.500 / 1.600 / 1.000 €).
# Las demás normas de 2026 que tocan la LIRPF no afectan al motor: exenciones (art. 7,
# DA 19.ª y DA 63.ª), La Palma (DA 57.ª, RDL 23/2026) y Ceuta (DA 64.ª, RDL 22/2026).

# -----------------------------------------------------------------------------
# DEDUCCIÓN POR OBTENCIÓN DE RENDIMIENTOS DEL TRABAJO (DA 61.ª) — cambia en 2026
# -----------------------------------------------------------------------------
# Misma forma que en 2025 (importe fijo hasta el SMI anual y reducción lineal de 0,2 € por
# euro); cambian el importe y los umbrales. 17.094 € = SMI de 2026 en cómputo anual
# (1.221 € × 14). El límite proporcional de la cuota sigue igual, así que el bloque sigue
# provisional por el mismo motivo que en 2025 (ver params/2025/estatal.yaml).
deduccion_obtencion_rendimientos_trabajo:
  norma: "DA 61.ª LIRPF, en la redacción del art. 28 del RDL 5/2026, de 17 de febrero (efectos 1-1-2026; convalidado por Resolución de 18-3-2026, BOE-A-2026-6483)"
  fuente: "BOE-A-2026-3810 (RDL 5/2026, art. 28); texto consolidado de la LIRPF en el BOE (BOE-A-2006-20764), DA 61.ª"
  estado: provisional
  importe_maximo: 590.89
  umbral_pleno: 17094            # rend. íntegros del trabajo <= 17.094 -> 590,89 €
  umbral_final: 20048.45         # entre ambos: 590,89 − 0,2 × (íntegros − 17.094); desde 20.048,45, 0

# -----------------------------------------------------------------------------
# DEDUCCIONES CON PLAZO (no las calcula el motor; se recogen con su vigencia)
# -----------------------------------------------------------------------------
# Prorrogadas a 2026 por el RDL 7/2026, de 20 de marzo (convalidado por Resolución de
# 26-3-2026, BOE-A-2026-7125). Las prórrogas anteriores de los RDL 16/2025 y 2/2026
# quedaron sin efecto al derogarlos el Congreso (BOE-A-2026-2024 y BOE-A-2026-4667).
deduccion_obras_eficiencia_energetica:
  norma: "DA 50.ª LIRPF, en la redacción del art. 36.1 del RDL 7/2026, de 20 de marzo"
  fuente: "BOE-A-2026-6544 (RDL 7/2026, art. 36.1); texto consolidado de la LIRPF en el BOE, DA 50.ª"
  estado: confirmado
  reduccion_demanda:   { porcentaje: 0.20, base_maxima: 5000,  pagos_hasta: "2026-12-31" }
  reduccion_consumo:   { porcentaje: 0.40, base_maxima: 7500,  pagos_hasta: "2026-12-31" }
  rehabilitacion_edif: { porcentaje: 0.60, base_maxima: 5000,  pagos_hasta: "2027-12-31", base_acumulada_maxima: 15000 }
  # En 2025 la base del apartado 3 figuraba como 15.000 €: es el tope acumulado; la base
  # anual es de 5.000 € (el exceso se deduce en los cuatro ejercicios siguientes).

deduccion_vehiculos_electricos:
  norma: "DA 58.ª LIRPF, en la redacción del art. 36.2 del RDL 7/2026, de 20 de marzo (efectos 1-1-2026)"
  fuente: "BOE-A-2026-6544 (RDL 7/2026, art. 36.2); texto consolidado de la LIRPF en el BOE, DA 58.ª"
  estado: confirmado
  porcentaje: 0.15
  base_maxima_vehiculo: 20000
  base_maxima_punto_recarga: 4000
  adquisicion_hasta: "2026-12-31"   # y matriculación antes del 31-12-2026
  instalacion_recarga_hasta: 2026   # último período en que puede finalizar la instalación

deduccion_autoconsumo_renovable:
  norma: "DA 62.ª LIRPF, añadida por el art. 36.3 del RDL 7/2026, de 20 de marzo (efectos 1-1-2026)"
  fuente: "BOE-A-2026-6544 (RDL 7/2026, art. 36.3); texto consolidado de la LIRPF en el BOE, DA 62.ª"
  estado: confirmado
  # Instalaciones de autoconsumo eléctrico renovable (RD 244/2019) pagadas e instaladas en
  # 2026: 10 % en un inmueble propio o 20 % en un edificio residencial; base máxima anual
  # de 5.000 €. Incompatible con la DA 50.ª para la misma instalación. Se resta de la cuota
  # íntegra estatal. No la calcula el motor.
  porcentaje_inmueble: 0.10
  porcentaje_edificio_residencial: 0.20
  base_maxima: 5000
  pagos_hasta: "2026-12-31"

# -----------------------------------------------------------------------------
# ESTIMACIÓN OBJETIVA (módulos) — sin verificar para 2026
# -----------------------------------------------------------------------------
estimacion_objetiva:
  norma: "Art. 31.1.3.ª y DT 32.ª LIRPF; Orden HAC/1425/2025, de 9 de diciembre (módulos de 2026)"
  fuente: "Texto consolidado de la LIRPF en el BOE (DT 32.ª, a 09-09-2026)"
  estado: pendiente
  # La DT 32.ª consolidada solo eleva los límites a 250.000 / 125.000 € para 2016-2024:
  # las prórrogas para 2025 y 2026 (RDL 16/2025 y RDL 2/2026) se derogaron y el RDL 7/2026
  # no las recoge. Sin norma de prórroga, regirían los 150.000 / 75.000 € del art. 31.1.3.ª.
  # Falta confirmar que ninguna otra norma de 2026 los fije. El motor no usa estas cifras
  # (los módulos entran como rendimiento neto exógeno).
