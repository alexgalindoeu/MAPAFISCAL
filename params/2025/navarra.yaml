# =============================================================================
# PARÁMETROS IRPF — COMUNIDAD FORAL DE NAVARRA — EJERCICIO 2025
# =============================================================================
# Norma: Decreto Foral Legislativo 4/2008, de 2 de junio, Texto Refundido de la
#        Ley Foral del IRPF, redacción vigente 2025.
#        Ley Foral 22/2023 (deflactación 3 %, tarifa vigente). LF 20/2024 y
#        LF 17/2025 NO modificaron la tarifa (⇒ 2025 = 2026 en escalas).
#        Convenio Económico: Ley 28/1990.
# Fuente: guiafiscal.es/irpf/navarra (tablas literales del BON) + Iberley
#         "Escala IRPF Navarra"; texto TR IRPF Navarra (BON).
#
# Diferencias estructurales frente al territorio común:
#   - Tarifa foral ÚNICA sobre la base liquidable general (sin escala estatal).
#   - Mínimo personal y familiar = DEDUCCIÓN DE LA CUOTA (no reduce la base).
#   - Tarifa del ahorro foral propia.
#   - Reducción por rendimientos del trabajo con tabla propia + deducción por
#     trabajo en cuota.
#   - Coeficientes de actualización de inmuebles: VIGENTES.
# =============================================================================

