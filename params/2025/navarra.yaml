  estado: pendiente

deducciones_vivienda:
  norma: "Art. 62.1 TR IRPF Navarra (adquisición: régimen transitorio)"
  estado: pendiente
  adquisicion: {}

# Deducción por alquiler de vivienda habitual (cuota). Texto literal de la LF 22/2023:
# "El 15 por 100, con el máximo de 1.500 euros anuales [...] siempre que: – el sujeto
# pasivo no tenga rentas superiores, excluidas las exentas, a 30.000 euros; – las
# cantidades satisfechas en concepto de alquiler excedan del 10 por 100 de las rentas
# [...]. Esta deducción será del 20 por 100, con el máximo de 1.600 euros anuales, [...]
# del sujeto pasivo que [...] tenga una edad inferior a 30 años o forme parte de una
# unidad familiar a la que se refiere el artículo 71.1.c)". Sin cambios en LF 20/2024.
deduccion_alquiler_vivienda:
  norma: "Art. 62.2 DFL 4/2008 (TR IRPF Navarra), redacción de la Ley Foral 22/2023, art. primero.Nueve (efectos 2024)"
  fuente: "BOE-A-2024-1694 (Ley Foral 22/2023, de 26 de diciembre); BOE-A-2025-719 (LF 20/2024: sin cambios en el art. 62.2)"
  estado: confirmado
  general:              { porcentaje: 0.15, limite: 1500 }
  joven_o_monoparental: { porcentaje: 0.20, limite: 1600, edad_max: 30 }   # edad inferior a 30, o unidad monoparental (art. 71.1.c)
  rentas_max: 30000       # rentas del sujeto pasivo, excluidas las exentas (el motor usa la base imponible)
  umbral_esfuerzo: 0.10   # el alquiler debe superar el 10 % de esas rentas

# Deducción por arrendamiento para emancipación (sobre la cuota diferencial: reembolsable).
# Incompatible con la del art. 62.2: el motor aplica la más favorable.
deduccion_emancipacion:
  norma: "Art. 68 quinquies.A DFL 4/2008, redacción de la Ley Foral 22/2023, art. primero.Quince (efectos 2024)"
  fuente: "BOE-A-2024-1694 (Ley Foral 22/2023): A.1 '23 a 35 años inclusive ... 50 por 100 de la renta ... límite máximo de 280 euros mensuales'; A.3 'rentas, incluidas las exentas, superiores a 22.000 euros ... o 33.000 euros conjuntamente con el resto de miembros de la unidad familiar'"
  estado: provisional   # resto de requisitos del art. 68 quinquies.A (contrato, no ser titular de vivienda, duración máxima) no modelados; rentas aproximadas por la base imponible del ámbito
  edad_min: 23
  edad_max: 35
  porcentaje: 0.50
  limite_mensual: 280
  rentas_max_individual: 22000
  rentas_max_unidad_familiar: 33000

# Deducción por pensión de jubilación contributiva (sobre la cuota diferencial:
# reembolsable): diferencia hasta 14.490 € (art. 68.B.2, redacción LF 20/2024).
deduccion_pension_jubilacion:
  norma: "Art. 68.B DFL 4/2008, redacción de la Ley Foral 20/2024, art. primero.Trece (efectos 2025)"
  fuente: "BOE-A-2025-719 (Ley Foral 20/2024, de 26 de diciembre)"
  estado: provisional   # no distingue las pensiones con complemento a mínimos (68.B.1: diferencia sobre la cuantía mínima); requisito de no declarar Patrimonio no modelado; rentas aproximadas por la base imponible
  umbral: 14490
  rentas_max_individual: 21619.59     # otras rentas + pensión + deducción; el exceso reduce la deducción
  rentas_max_unidad_familiar: 28980

