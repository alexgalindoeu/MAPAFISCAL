# =============================================================================
# PARÁMETROS IRPF — TRAMO AUTONÓMICO (CCAA de régimen común) — EJERCICIO 2025
# =============================================================================
# Cada territorio aporta sobre el núcleo estatal:
#   (A) escala_general_autonomica  -> sustituye a la escala supletoria del art. 65
#   (B) deducciones_autonomicas    -> deducciones de la cuota íntegra autonómica
#
# ESCALAS: TODAS verificadas contra AEAT, Manual Práctico Renta 2025,
#   "Gravamen de la base liquidable general > Gravamen autonómico" (subpágina por CCAA).
#   URL base: https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/
#             manuales-practicos/irpf-2025/c15-calculo-impuesto-determinacion-cuotas-integras/
#             gravamen-base-liquidable-general/gravamen-autonomico/<comunidad>.html
#
# DEDUCCIONES AUTONÓMICAS: estado `pendiente` de forma generalizada — requieren
#   extraer, norma a norma, de la ley de tributos cedidos de cada CCAA + del anexo
#   "Deducciones autonómicas" del Manual Práctico Renta 2025. El catálogo de
#   `slots` está enumerado abajo por comunidad para guiar esa carga (hito H3).
# =============================================================================

meta:
  ejercicio: 2025
  regimen: comun
  escalas_estado: confirmado
  deducciones_estado: pendiente
  catalogo_slots_deducciones:
    - nacimiento_adopcion
    - familia_numerosa
    - familia_monoparental
    - cuidado_hijos_guarderia
    - ascendientes_mayores
    - discapacidad_contribuyente
    - discapacidad_familiar
    - arrendamiento_vivienda_general
    - arrendamiento_vivienda_joven
    - adquisicion_rehabilitacion_vivienda
    - vivienda_zona_despoblacion
    - donativos
    - gastos_educativos
    - gastos_salud_seguro_medico
    - inversion_empresas_nueva_creacion
    - autoempleo_jovenes
    - conciliacion_empleada_hogar
    - acogimiento
    - partos_multiples
    - victimas_violencia_terrorismo
    - complemento_tramo_autonomico_vivienda

territorios:

  ES-AN:
    nombre: "Andalucía"
    minimo_autonomico:   # importes propios para el gravamen autonómico (art. 46.1.a Ley 22/2009)
      norma: "Art. 23 bis Ley 5/2021, de 20 de octubre, de Tributos Cedidos de la Comunidad Autónoma de Andalucía"
      fuente: "AEAT Manual Práctico Renta 2025 — Mínimo personal y familiar autonómico: Comunidad Autónoma de Andalucía; y Cuadro comparativo de los importes de los mínimos personales y familiares, estatal y autonómicos para 2025"
      estado: confirmado
      minimo_contribuyente: { general: 5790, incremento_mayor_65: 1200, incremento_mayor_75: 1460 }
      minimo_descendientes: { importes: { "1": 2510, "2": 2820, "3": 4170, "4+": 4700 }, incremento_menor_3_anios: 2920 }
      minimo_ascendientes: { importe: 1200, incremento_mayor_75: 1460 }
      minimo_discapacidad: { grado_33_64: 3130, grado_65_mas: 9390, gastos_asistencia: 3130 }
    escala_general_autonomica:
      norma: "Art. 23 Ley 5/2021 de Tributos Cedidos de Andalucía"
      fuente: "AEAT Manual Renta 2025 — Gravamen autonómico Andalucía"
      estado: confirmado
      tramos:
        - { hasta: 13000,  tipo: 0.095 }
        - { hasta: 21100,  tipo: 0.12 }
        - { hasta: 35200,  tipo: 0.15 }
        - { hasta: 60000,  tipo: 0.185 }
        - { hasta: .inf,   tipo: 0.225 }
    deducciones_autonomicas:
      # Ley 5/2021 de Tributos Cedidos de Andalucía. Catálogo total ~17; 10 implementadas.
      estado: cargado
      fuente: "Ley 5/2021 de Tributos Cedidos de Andalucía, arts. 10-22 bis; AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Andalucía"
      lista:
        - id: nacimiento_adopcion
          norma: "Art. 11 Ley 5/2021"
          tipo: fija_por_hijo_nacido
          importe: 200
          importe_multiple: 200
          anios_ventana: 1
        - id: arrendamiento_vivienda_habitual
          norma: "Art. 10 Ley 5/2021"
          tipo: porcentaje_campo
          campo: alquiler_vivienda_pagos
          porcentaje: 0.15
          limite: 1200
          edad_max: 35
          edad_min_alt: 65      # también aplican >65, víctimas de violencia/terrorismo y personas con discapacidad
          base_max_individual: 25000
          base_max_conjunta: 30000
        - id: familia_numerosa_general
          norma: "Art. 14 Ley 5/2021"
          tipo: fija
          importe: 200
          requiere_familia_numerosa: true
          base_max_individual: 25000   # art. 14.3 (suma de bases imponibles general y del ahorro)
          base_max_conjunta: 30000
        - id: familia_numerosa_especial
          norma: "Art. 14 Ley 5/2021"
          tipo: fija
          importe: 200          # 400 total en especial; 200 adicional sobre la general
          requiere_familia_numerosa: especial
          base_max_individual: 25000   # art. 14.3
          base_max_conjunta: 30000
        - id: familia_monoparental
          norma: "Art. 13 Ley 5/2021"
          tipo: fija
          importe: 100
          requiere_monoparental: true
          base_max_individual: 80000
          base_max_conjunta: 100000
        - id: familia_monoparental_ascendientes_75
          norma: "Art. 13.2 y 13.3 Ley 5/2021 (incremento)"
          estado: confirmado
          fuente: "Art. 13 Ley 5/2021, redacción vigente en 2025 (BOE-A-2021-17915); AEAT Manual Práctico Renta 2025, Parte 2, Andalucía, «Para el padre o madre de familia monoparental y, en su caso, con ascendientes mayores de 75 años» (https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-andalucia/padre-madre-familia-monoparental-ascendientes-anos.html)"
          tipo: fija_por_ascendiente
          importe: 100           # por ascendiente que conviva con la familia monoparental y genere el mínimo por ascendientes mayores de 75 años
          edad_ascendiente_min: 76   # «edad superior a 75 años» (AEAT, mínimo por ascendientes; el motor lo aplica con edad > 75)
          ascendiente_discapacidad: false   # la discapacidad del ascendiente no da derecho al incremento
          requiere_minimo_ascendiente: true
          requiere_monoparental: true
          base_max_individual: 80000
          base_max_conjunta: 100000
        - id: contribuyente_discapacidad
          norma: "Art. 16 Ley 5/2021"
          tipo: fija
          importe: 150
          requiere_discapacidad_contribuyente: true   # grado >= 33 %
          base_max_individual: 25000
          base_max_conjunta: 30000
        - id: gastos_educativos_idiomas_informatica
          norma: "Art. 15 Ley 5/2021"
          tipo: porcentaje_campo_hijo
          campo: gastos_idiomas_informatica
          porcentaje: 0.15
          limite: 150            # por descendiente
          base_max_individual: 80000
          base_max_conjunta: 100000
        # Ayuda doméstica (art. 19.1): dos supuestos alternativos, mismo importe -> variantes
        # excluyentes del grupo `ayuda_domestica`. Sin límite de base.
        - id: ayuda_domestica
          norma: "Art. 19.1.a) Ley 5/2021"
          estado: confirmado
          fuente: "Art. 19 Ley 5/2021, redacción de la Ley 1/2022 (BOE-A-2023-1604), vigente en 2025; AEAT Manual Práctico Renta 2025, Parte 2, Andalucía, «Por ayuda doméstica» (https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-andalucia/ayuda-domestica.html)"
          tipo: porcentaje_campo
          campo: cuotas_ss_empleada_hogar
          porcentaje: 0.20
          limite: 500
          grupo: ayuda_domestica
          descendientes_min: 1                 # hijos que dan derecho al mínimo por descendientes
          requiere_progenitores_trabajan: true # con cónyuge o pareja, los dos con rendimientos del trabajo o de actividades
        - id: ayuda_domestica_mayores_75
          norma: "Art. 19.1.b) Ley 5/2021"
          estado: confirmado
          fuente: "Art. 19 Ley 5/2021, redacción de la Ley 1/2022 (BOE-A-2023-1604), vigente en 2025; AEAT Manual Práctico Renta 2025, Parte 2, Andalucía, «Por ayuda doméstica» (https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-andalucia/ayuda-domestica.html)"
          tipo: porcentaje_campo
          campo: cuotas_ss_empleada_hogar
          porcentaje: 0.20
          limite: 500
          grupo: ayuda_domestica
          edad_min: 75   # titular del hogar o su cónyuge/pareja con 75 años o más; en individual el motor solo mira la edad del declarante liquidado
        - id: ejercicio_fisico_deporte
          norma: "Art. 22 bis Ley 5/2021"
          estado: confirmado
          fuente: "Art. 22 bis Ley 5/2021, añadido por la DF 9.ª.3 de la Ley 8/2025 con efectos desde el 1-1-2025 (DF 18.ª.b; BOE-A-2026-945); art. 60 (obligaciones formales, sin límite de renta); AEAT Manual Práctico Renta 2025, Parte 2, Andalucía, «Para fomentar el ejercicio físico y la práctica deportiva» (https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-andalucia/fomentar-ejercicio-fisico-practica-deportiva.html)"
          tipo: porcentaje_campo
          campo: gastos_deporte
          porcentaje: 0.15
          limite: 100            # por contribuyente; sin límite de base (el art. 60 solo regula la justificación)
      pendientes:
        - inversion_vivienda_protegida_jovenes
        - adopcion_internacional
        - conyuge_pareja_discapacidad          # 100 € — requiere flag de cónyuge no declarante con discapacidad >= 65 %
        - asistencia_personas_discapacidad     # 100 € + 20 % empleada hogar
        - inversion_sociedades_nueva_creacion
        - defensa_juridica_laboral
        - donativos_ecologicos
        - gastos_veterinarios
        - familias_celiacas

  ES-AR:
    nombre: "Aragón"
    escala_general_autonomica:
      norma: "Art. 110-1 TR Disposiciones tributos cedidos de Aragón (DL 1/2005)"
      fuente: "AEAT Manual Renta 2025 — Gravamen autonómico Aragón"
      estado: confirmado
      tramos:
        - { hasta: 13072.50, tipo: 0.095 }
        - { hasta: 21210,    tipo: 0.12 }
        - { hasta: 36960,    tipo: 0.15 }
        - { hasta: 52500,    tipo: 0.185 }
        - { hasta: 60000,    tipo: 0.205 }
        - { hasta: 80000,    tipo: 0.23 }
        - { hasta: 90000,    tipo: 0.24 }
        - { hasta: 130000,   tipo: 0.25 }
        - { hasta: .inf,     tipo: 0.255 }
    deducciones_autonomicas:
      # TR de tributos cedidos de Aragón (DL 1/2005), art. 110. Solo se modela el
      # RÉGIMEN GENERAL. El "régimen de fiscalidad diferenciada" (importes más altos
      # para residentes en asentamientos rurales con alto riesgo de despoblación)
      # depende del municipio y NO se modela — ver docs/05, decisiones pendientes.
      estado: cargado
      fuente: "TR tributos cedidos de Aragón (DL 1/2005), art. 110 (arts. 110-2/3/4/5/14/17); AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Aragón"
      lista:
        - id: nacimiento_adopcion_tercer_hijo_renta_baja
          norma: "Art. 110-2 DL 1/2005 Aragón"
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importes_por_orden: { "1": 0, "2": 0, "3+": 600 }   # solo 3.er hijo o sucesivos
          base_gate: menos_minimo
          base_max_individual: 21000
          base_max_conjunta: 35000
          prorratea_progenitores: true
        - id: nacimiento_adopcion_tercer_hijo_general
          norma: "Art. 110-2 DL 1/2005 Aragón"
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importes_por_orden: { "1": 0, "2": 0, "3+": 500 }
          base_gate: menos_minimo
          base_min_individual: 21000.01
          base_min_conjunta: 35000.01
          prorratea_progenitores: true
        - id: cuidado_personas_dependientes
          norma: "Art. 110-5 DL 1/2005 Aragón"
          estado: provisional   # el límite de renta usa base − (mínimo contrib. + mínimo desc.); aquí se resta el MPF total
          tipo: fija
          importe: 150
          requiere_dependiente_a_cargo: true   # ascendiente >= 75, o asc./desc. con discapacidad >= 65 %
          base_gate: menos_minimo
          base_max_individual: 21000
          base_max_conjunta: 35000
          prorratea_progenitores: true
        - id: mayores_70_anos
          norma: "Art. 110-14 DL 1/2005 Aragón"
          estado: provisional   # exige además obtener rendimientos del trabajo y/o de actividades (no comprobado; las pensiones cuentan como trabajo)
          tipo: fija
          importe: 75
          edad_min: 70
          base_max_individual: 23000
          base_max_conjunta: 35000
        - id: gastos_guarderia_menores_3
          norma: "Art. 110-17 DL 1/2005 Aragón"
          estado: provisional   # 250 €/hijo < 3; 125 € el año en que cumple 3 (no modelado); base del ahorro <= 4.000 no comprobada
          tipo: porcentaje_campo_hijo
          campo: gastos_guarderia
          porcentaje: 0.15
          limite: 250
          edad_hijo_max: 2
          base_max_individual: 35000
          base_max_conjunta: 50000
          prorratea_progenitores: true
        # --- condicionadas al municipio de residencia ---
        - id: residencia_municipios_despoblacion
          norma: "Arts. 160-1 y 160-2.8 DL 1/2005 Aragón"
          estado: provisional   # no se modelan el requisito de base del ahorro <= 4.000 € ni el de residir allí los 4 años siguientes; en conjunta la ley la da a cada contribuyente que cumpla (aquí una vez)
          tipo: fija
          importe: 600
          requiere_zona_despoblada: true   # asentamientos rurales en riesgo extremo de despoblación (Rango X)
          base_max_individual: 34999.99
          base_max_conjunta: 49999.99
        - id: nacimiento_municipios_pequenos_renta_baja
          norma: "Art. 110-16 DL 1/2005 Aragón"
          estado: provisional   # el límite legal es sobre base imponible (aquí liquidable) y se exige residir también el año anterior en municipio < 10.000 hab.
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importes_por_orden: { "1": 200, "2": 300, "3+": 0 }
          municipio_hab_max: 9999
          base_max_individual: 23000
          base_max_conjunta: 35000
          grupo: nacimiento_rural_ar
        - id: nacimiento_municipios_pequenos
          norma: "Art. 110-16 DL 1/2005 Aragón"
          estado: provisional
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importes_por_orden: { "1": 100, "2": 150, "3+": 0 }
          municipio_hab_max: 9999
          grupo: nacimiento_rural_ar
      pendientes:
        - nacimiento_adopcion_hijo_discapacidad         # necesita marcar discapacidad del recién nacido
        - adopcion_internacional                        # necesita flag "adopción internacional"
        - libros_texto_material_escolar                 # tabla de límites por tramo de base (no modelada)
        - clases_apoyo_refuerzo                         # tabla de límites por tramo de base (no modelada)
        - adquisicion_rehabilitacion_vivienda_nucleos_rurales   # condicionada a municipio
        - arrendamiento_vivienda_social_arrendador
        - donaciones_ecologicas_i_d_i
        - vivienda_victimas_terrorismo
        - inversion_entidades_nueva_creacion
        - inversion_mab
        - inversion_economia_social
        - formacion_autonomia_menores_discapacidad
        - regimen_fiscalidad_diferenciada               # importes incrementados por municipio (no modelado)

  ES-AS:
    nombre: "Principado de Asturias"
    minimo_autonomico:   # importes propios para el gravamen autonómico (art. 46.1.a Ley 22/2009)
      norma: "Arts. 2 bis, 2 ter, 2 quater y 2 quinquies DL 2/2014, de 22 de octubre (TR tributos cedidos del Principado de Asturias)"
      fuente: "AEAT Manual Práctico Renta 2025 — Mínimo personal y familiar autonómico: Comunidad Autónoma del Principado de Asturias; y Cuadro comparativo de los importes de los mínimos personales y familiares, estatal y autonómicos para 2025"
      estado: confirmado
      minimo_contribuyente: { general: 6105, incremento_mayor_65: 1265, incremento_mayor_75: 1540 }
      minimo_descendientes: { importes: { "1": 2640, "2": 2970, "3": 4400, "4+": 4950 }, incremento_menor_3_anios: 3080 }
      minimo_ascendientes: { importe: 1265, incremento_mayor_75: 1540 }
      minimo_discapacidad: { grado_33_64: 3300, grado_65_mas: 9900, gastos_asistencia: 3300 }
    escala_general_autonomica:
      norma: "Art. 2 TR tributos cedidos de Asturias (DL 2/2014), mod. Ley 3/2025 (efectos 2025)"
      fuente: "AEAT Manual Renta 2025 — Gravamen autonómico Asturias"
      estado: confirmado
      tramos:
        - { hasta: 12450,    tipo: 0.09 }
        - { hasta: 17707.20, tipo: 0.12 }
        - { hasta: 33007.20, tipo: 0.14 }
        - { hasta: 53407.20, tipo: 0.192 }
        - { hasta: 70000,    tipo: 0.215 }
        - { hasta: 90000,    tipo: 0.225 }
        - { hasta: 175000,   tipo: 0.25 }
        - { hasta: .inf,     tipo: 0.26 }
    deducciones_autonomicas:
      # TR de tributos cedidos de Asturias (DL 2/2014), arts. 7-14 terdecies.
      # Las variantes incrementadas para concejos en riesgo de despoblamiento
      # NO se modelan (dependen del concejo de residencia).
      estado: cargado
      fuente: "TR tributos cedidos de Asturias (DL 2/2014), arts. 7, 10, 11, 12, 14 bis, 14 duodecies y 14 terdecies; AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Principado de Asturias"
      lista:
        - id: familia_numerosa_general
          norma: "Art. 11 DL 2/2014 Asturias"
          tipo: fija
          importe: 1000
          requiere_familia_numerosa: true
        - id: familia_numerosa_especial
          norma: "Art. 11 DL 2/2014 Asturias"
          tipo: fija
          importe: 1000        # 2.000 total en especial; 1.000 adicional
          requiere_familia_numerosa: especial
        - id: familias_monoparentales
          norma: "Art. 12 DL 2/2014 Asturias"
          estado: provisional   # no aplicable en custodia compartida (no modelado)
          tipo: fija
          importe: 500
          requiere_monoparental: true
          descendientes_min: 1
          base_max_individual: 45000
          base_max_conjunta: 45000
        - id: partos_multiples
          norma: "Art. 10 DL 2/2014 Asturias"
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importe: 1000          # por cada hijo nacido/adoptado en el parto/adopción múltiple
          importe_multiple: 0
          requiere_parto_multiple: true
          prorratea_progenitores: true
        - id: gastos_descendientes_0_3
          norma: "Art. 14 bis DL 2/2014 Asturias"
          estado: provisional   # la variante del 30 %/1.000 € (concejos en riesgo de despoblamiento) y la minoración por ayudas del Principado no se modelan
          tipo: porcentaje_campo_hijo
          campo: gastos_guarderia
          porcentaje: 0.15
          limite: 500
          edad_hijo_max: 2
          base_max_individual: 26000
          base_max_conjunta: 37000
        - id: cuidado_descendientes_hasta_25
          norma: "Art. 14 duodecies DL 2/2014 Asturias"
          tipo: fija_por_hijo
          importe: 600
          edad_hijo_max: 25
          base_max_individual: 35000
          base_max_conjunta: 45000
          prorratea_progenitores: true
        - id: emancipacion_jovenes_35
          norma: "Art. 14 terdecies DL 2/2014 Asturias"
          estado: provisional   # gastos vinculados a la emancipación (mobiliario, transporte, alquiler/compra); se toma el campo gastos_emancipacion
          tipo: porcentaje_campo
          campo: gastos_emancipacion
          porcentaje: 1.00
          limite: 1000
          edad_max: 36
          base_max_individual: 35000
          base_max_conjunta: 45000
        - id: arrendamiento_vivienda_habitual_joven
          norma: "Art. 7 DL 2/2014 Asturias"
          estado: provisional   # 30 %/1.500 € para < 36 años, familia numerosa, monoparental o víctima de violencia de género; aquí solo por edad
          tipo: porcentaje_campo
          campo: alquiler_vivienda_pagos
          porcentaje: 0.30
          limite: 1500
          edad_max: 36
          base_max_individual: 35000
          base_max_conjunta: 45000
        - id: arrendamiento_vivienda_habitual_general
          norma: "Art. 7 DL 2/2014 Asturias"
          tipo: porcentaje_campo
          campo: alquiler_vivienda_pagos
          porcentaje: 0.10
          limite: 500
          edad_min: 36
          base_max_individual: 35000
          base_max_conjunta: 45000
        # --- condicionadas al municipio de residencia ---
        - id: nacimiento_concejos_despoblamiento
          norma: "Art. 14 quater DL 2/2014 Asturias"
          estado: provisional   # el Manual no detalla el reparto entre progenitores convivientes; se aplica el reparto general
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importes_por_orden: { "1": 0, "2": 300, "3+": 300 }   # segundo hijo y sucesivos
          requiere_zona_despoblada: true   # concejos en riesgo de despoblamiento o crisis demográfica (Decreto 83/2025)
      pendientes:
        - libros_texto_material_escolar          # tabla de límites por tramo de base (no modelada)
        - acogimiento_no_remunerado_mayores_65
        - adquisicion_adecuacion_vivienda_discapacidad
        - inversion_vivienda_protegida
        - adopcion_internacional
        - acogimiento_familiar_menores
        - certificacion_forestal_sostenible
        - autonomos_concejos_despoblamiento                # condicionada a concejo
        - transporte_publico_concejos_despoblamiento       # condicionada a concejo
        - gastos_formacion_i_d
        - traslado_domicilio_fiscal_a_asturias
        - vehiculos_electricos
        - gastos_vitales_hasta_35
        - fallecimiento_progenitor_accidente_laboral
        - inversion_entidades_nueva_creacion
        - enfermedad_celiaca

  ES-IB:
    nombre: "Illes Balears"
    minimo_autonomico:   # importes propios para el gravamen autonómico (art. 46.1.a Ley 22/2009)
