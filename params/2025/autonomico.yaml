      # Ley 13/1997 de la Comunitat Valenciana, art. 4 (mod. Ley 5/2025). Catálogo total
      # ~40; 13 implementadas (con variantes). Reducción lineal (taper) de base modelada.
      estado: cargado
      fuente: "Ley 13/1997 de la Comunitat Valenciana, art. 4.Uno (a, d, e, g, h, n, t, v, x); AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Comunitat Valenciana"
      lista:
        # Reducción lineal común a la mayoría (art. 4.Cuatro y Cinco): importe (o límite)
        # íntegro si base liquidable < 27.000 (44.000 conjunta); entre 27.000 y 30.000
        # (44.000-47.000) se multiplica por 1 − (base − 27.000)/3.000.
        - id: nacimiento_adopcion
          norma: "Art. 4.Uno.a), Cuatro y Cinco Ley 13/1997 (red. Ley 5/2025)"
          tipo: fija_por_hijo_nacido
          anios_ventana: 3                 # ejercicio del nacimiento y los dos siguientes
          importes_por_orden: { "1": 600, "2": 750, "3+": 900 }
          prorratea_progenitores: true
          base_max_individual: 30000
          base_max_conjunta: 47000
          taper_individual: [27000, 30000]
          taper_conjunta: [44000, 47000]
        - id: familia_numerosa_general
          norma: "Art. 4.Uno.d), Cuatro y Cinco Ley 13/1997"
          tipo: fija
          importe: 330
          familia_numerosa_categoria: general
          prorratea_progenitores: true
          base_max_individual: 30000
          base_max_conjunta: 47000
          taper_individual: [27000, 30000]
          taper_conjunta: [44000, 47000]
        - id: familia_numerosa_especial
          norma: "Art. 4.Uno.d), Cuatro y Cinco Ley 13/1997"
          tipo: fija
          importe: 660
          familia_numerosa_categoria: especial
          prorratea_progenitores: true
          base_max_individual: 35000
          base_max_conjunta: 58000
          taper_individual: [31000, 35000]
          taper_conjunta: [54000, 58000]
        - id: familia_monoparental
          norma: "Art. 4.Uno.d), Cuatro y Cinco Ley 13/1997"
          estado: provisional   # modela la monoparental de categoría general (330 €); la especial (660 €) exige el título de familia monoparental especial (Decreto 19/2018), no modelado
          tipo: fija
          importe: 330
          requiere_monoparental: true
          familia_numerosa_categoria: "no"   # es la misma deducción que la de familia numerosa: no se acumulan
          base_max_individual: 30000
          base_max_conjunta: 47000
          taper_individual: [27000, 30000]
          taper_conjunta: [44000, 47000]
        - id: custodia_guarderias
          norma: "Art. 4.Uno.e), Cuatro y Cinco Ley 13/1997"
          tipo: porcentaje_campo_hijo
          campo: gastos_guarderia
          porcentaje: 0.15
          limite: 297           # por hijo < 3 años; el límite es el que se reduce en la franja de taper
          edad_hijo_max: 2
          requiere_progenitores_trabajan: true
          prorratea_progenitores: true
          base_max_individual: 30000
          base_max_conjunta: 47000
          taper_individual: [27000, 30000]
          taper_conjunta: [44000, 47000]
        - id: contribuyente_discapacidad_65
          norma: "Art. 4.Uno.g), Cuatro y Cinco Ley 13/1997"
          tipo: fija
          importe: 197
          requiere_discapacidad_contribuyente: true   # grado >= 33 %
          edad_min: 65
          base_max_individual: 30000
          base_max_conjunta: 47000
          taper_individual: [27000, 30000]
          taper_conjunta: [44000, 47000]
        - id: ascendientes_75
          norma: "Art. 4.Uno.h), Cuatro y Cinco Ley 13/1997"
