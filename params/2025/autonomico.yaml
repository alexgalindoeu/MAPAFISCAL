  ES-CT:
    nombre: "Cataluña"
    minimo_autonomico:   # importes propios para el gravamen autonómico (art. 46.1.a Ley 22/2009)
      # Mismo importe que el art. 57 LIRPF: no modifica ninguno.
      norma: "Art. 611-2 DL 1/2024, de 12 de marzo (libro sexto del código tributario de Catalunya)"
      fuente: "AEAT Manual Práctico Renta 2025 — Mínimo personal y familiar autonómico: Comunidad Autónoma de Cataluña; y Cuadro comparativo de los importes de los mínimos personales y familiares, estatal y autonómicos para 2025"
      estado: confirmado
    escala_general_autonomica:
      norma: "Art. 611-1 DL 1/2024 (libro sexto del Código Tributario de Cataluña)"
      fuente: "AEAT Manual Renta 2025 — Gravamen autonómico Cataluña"
      estado: confirmado
      tramos:
        - { hasta: 12500,  tipo: 0.095 }
        - { hasta: 22000,  tipo: 0.125 }
        - { hasta: 33000,  tipo: 0.16 }
        - { hasta: 53000,  tipo: 0.19 }
        - { hasta: 90000,  tipo: 0.215 }
        - { hasta: 120000, tipo: 0.235 }
        - { hasta: 175000, tipo: 0.245 }
        - { hasta: .inf,   tipo: 0.255 }
    deducciones_autonomicas:
      # Catálogo del libro sexto del Código Tributario de Catalunya (DL 1/2024), arts. 612-x.
      # 7 de 13 deducciones implementadas; 6 pendientes por requerir campos de entrada
      # no modelados (año de viudedad, condición de víctima de violencia, más de un pagador,
      # préstamo AGAUR de máster/doctorado) o por estar ya cubiertas vía la deducción
      # estatal transitoria por vivienda (tramo autonómico general del 7,5 %).
      estado: cargado
      fuente: "DL 1/2024 (libro sexto del Código Tributario de Catalunya); AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Cataluña"
      lista:
        - id: nacimiento_adopcion
          norma: "Art. 612-1 DL 1/2024"
          tipo: fija_por_hijo_nacido
          importe: 150            # por progenitor en declaración individual
          importe_conjunta: 300
          importe_multiple: 150
          anios_ventana: 1
          prorratea_progenitores: false   # cada progenitor aplica sus 150 € en individual (no se reparten)
        - id: arrendamiento_vivienda_habitual
          norma: "Art. 612-3 DL 1/2024"
          tipo: porcentaje_campo
          campo: alquiler_vivienda_pagos
          porcentaje: 0.10
          limite: 500
          edad_max: 36           # <=35 años (o paro >=183 días, o discapacidad >=65 %, o viudo >=65 — no modelados)
          base_gate: menos_minimo
          base_max_individual: 30000
          base_max_conjunta: 45000
        - id: rehabilitacion_vivienda_habitual
          norma: "Art. 612-4 DL 1/2024"
          tipo: porcentaje_campo
          campo: rehabilitacion_vivienda_pagos
          porcentaje: 0.015
          base_maxima: 9040
        - id: donativos_fomento_lengua_catalana
          norma: "Art. 612-6 DL 1/2024"
          tipo: porcentaje_campo
          campo: donativos_lengua_catalana
          porcentaje: 0.15
          limite_pct_cuota_autonomica: 0.10
        - id: donativos_investigacion_i_d_i
          norma: "Art. 612-7 DL 1/2024"
          tipo: porcentaje_campo
          campo: donativos_investigacion
          porcentaje: 0.30
          limite_pct_cuota_autonomica: 0.10
        - id: inversion_angel_inversor
          norma: "Art. 612-9 DL 1/2024"
          tipo: porcentaje_campo
          campo: inversion_angel_inversor
          porcentaje: 0.40      # 50 % si la sociedad está participada por universidades/centros de investigación (no distinguido)
          limite: 12000
        - id: inversion_cooperativas_agrarias_vivienda
          norma: "Art. 612-12 DL 1/2024"
          tipo: porcentaje_campo
          campo: inversion_cooperativas_cat
          porcentaje: 0.20
          limite: 3000
      pendientes:
        # Requieren campos de entrada no modelados por el motor:
        - viudedad_2023_2025                 # necesita "año de viudedad" + nº descendientes -> 150/300 €
        - alquiler_vivienda_victimas_violencia_machista  # necesita flag "víctima de violencia machista" -> 100 %/1.000 €
        - obligacion_declarar_dos_pagadores  # necesita flag ">1 pagador" y trabajo 15.876–22.000; deducción = cuota aut − cuota estatal
        - intereses_prestamos_master_doctorado  # préstamos AGAUR; campo específico
        # Ya cubierta parcialmente por la deducción estatal transitoria por vivienda:
        - tramo_autonomico_inversion_vivienda_9pct  # el 7,5 % general lo aplica deduccion_vivienda_transitoria; el 9 % incrementado (adquisición < 30-07-2011, base − mínimo ≤ 30.000) queda pendiente
        # Niche / falta de datos:
        - donaciones_medio_ambiente_patrimonio_natural  # art. 612-8 — % por confirmar

  ES-EX:
    nombre: "Extremadura"
    escala_general_autonomica:
      norma: "Art. 1 TR disposiciones legales de Extremadura en tributos cedidos (DL 1/2018)"
      fuente: "AEAT Manual Renta 2025 — Gravamen autonómico Extremadura"
      estado: confirmado
      tramos:
        - { hasta: 12450,  tipo: 0.08 }
        - { hasta: 20200,  tipo: 0.10 }
        - { hasta: 24200,  tipo: 0.16 }
        - { hasta: 35200,  tipo: 0.175 }
        - { hasta: 60000,  tipo: 0.21 }
        - { hasta: 80200,  tipo: 0.235 }
        - { hasta: 99200,  tipo: 0.24 }
        - { hasta: 120200, tipo: 0.245 }
        - { hasta: .inf,   tipo: 0.25 }
    deducciones_autonomicas:
      # TR de tributos cedidos de Extremadura (DL 1/2018), arts. 2-13. Límites de renta
      # generales (19.000 ind. / 24.000 conj.) del art. 12 bis. Los límites incrementados
      # para residentes en municipios < 3.000 hab. (28.000/45.000) NO se modelan.
      estado: cargado
      fuente: "TR tributos cedidos de Extremadura (DL 1/2018), arts. 3, 5, 6, 9, 10 y 12 bis; AEAT Manual Práctico Renta 2025, Parte 2 — Deducciones autonómicas / Extremadura"
      lista:
        - id: arrendamiento_vivienda_habitual
          norma: "Art. 9 DL 1/2018 Extremadura"
          estado: provisional   # alquiler en medio rural (30 %/1.500) y alternativas al requisito de edad (familia numerosa, ascendiente separado con 2 hijos, discapacidad >= 65 %) no modeladas
          tipo: porcentaje_campo
          campo: alquiler_vivienda_pagos
          porcentaje: 0.30
          limite: 1000
          edad_max: 36
          base_max_individual: 19000
          base_max_conjunta: 24000
        - id: material_escolar
          norma: "Art. 10 DL 1/2018 Extremadura"
          tipo: fija_por_hijo
          importe: 15
          edad_hijo_min: 6
          edad_hijo_max: 15
          base_max_individual: 19000
          base_max_conjunta: 24000
          prorratea_progenitores: true
        - id: partos_multiples
          norma: "Art. 3 DL 1/2018 Extremadura"
          tipo: fija_por_hijo_nacido
          anios_ventana: 1
          importe: 300            # por cada hijo nacido en el parto múltiple
          importe_multiple: 0     # el importe ya es por hijo; no sumar extra por parto múltiple
          requiere_parto_multiple: true
          base_max_individual: 19000
          base_max_conjunta: 24000
          prorratea_progenitores: true
        - id: cuidado_hijos_menores_14
          norma: "Art. 6 DL 1/2018 Extremadura"
          estado: provisional   # exige que ambos progenitores realicen actividad remunerada (no comprobado); límite por unidad de convivencia
          tipo: porcentaje_campo
          campo: gastos_cuidado_hijos
          porcentaje: 0.10
          limite: 400
          descendiente_edad_max: 14
          base_max_individual: 19000
          base_max_conjunta: 24000
        - id: cuidado_familiares_discapacidad
          norma: "Art. 5 DL 1/2018 Extremadura"
          estado: provisional   # 150 € por cada ascendiente/descendiente con discapacidad >= 65 %; aquí se aplica una sola vez
          tipo: fija
          importe: 150
          requiere_familiar_discapacidad_65: true
          base_max_individual: 19000
          base_max_conjunta: 24000
        # --- condicionadas al municipio de residencia ---
        - id: residencia_municipios_menos_3000
          norma: "Art. 11 ter DL 1/2018 Extremadura"
          estado: provisional   # en conjunta la ley reparte la cuota en proporción a las bases individuales (aquí 15 % de toda la cuota); el límite legal es sobre base imponible
          tipo: porcentaje_cuota_autonomica
          porcentaje: 0.15
          sobre_cuota_integra: true
          municipio_hab_max: 2999
          base_max_individual: 28000
          base_max_conjunta: 45000
      pendientes:
        - trabajo_dependiente             # 75 €; exige trabajo íntegro <= 12.000 y resto de rentas <= 300 (puerta no modelada)
        - contribuyentes_viudos           # 100/200 €; necesita marcar el estado de viudedad
        - acogimiento_menores
        - vivienda_habitual_jovenes_victimas_terrorismo
        - arrendadores_viviendas_vacias
        - rehabilitacion_viviendas_rurales_alquiler
        - inversion_acciones_constitucion_ampliacion
        - vivienda_zonas_rurales           # condicionada a municipio
        - intereses_financiacion_vivienda_jovenes
        - donaciones_culturales_deportistas
        - traslado_residencia_a_extremadura
        - ayudas_ela

