  estado: confirmado
  edad: 65
  renta_vitalicia_maxima: 240000
  plazo_constitucion_meses: 6

coeficientes_actualizacion_inmuebles:
  norma: "Suprimidos para IRPF por Ley 26/2014"
  estado: confirmado
  aplica: false   # en normativa foral SÍ aplican (ver ficheros forales)

# -----------------------------------------------------------------------------
# 8. INTEGRACIÓN Y COMPENSACIÓN (arts. 44–49 LIRPF)
# -----------------------------------------------------------------------------
integracion_compensacion:
  norma: "Arts. 47–49 LIRPF"
  estado: confirmado
  base_general_limite_perdidas_pct: 0.25   # pérdidas no derivadas de transmisión vs. saldo positivo rendimientos+imputaciones
  base_ahorro_limite_compensacion_pct: 0.25
  anios_arrastre: 4

# -----------------------------------------------------------------------------
# 9. REDUCCIONES DE LA BASE IMPONIBLE GENERAL (arts. 51–55, 84 LIRPF)
# -----------------------------------------------------------------------------
reduccion_prevision_social:
  norma: "Arts. 51.6 y 52.1 LIRPF; DA 16.ª LIRPF"
  fuente: "AEAT Manual Práctico Renta 2025, Reducciones por aportaciones a sistemas de previsión social → 6.2 Límites y exceso de aportaciones"
  # Por partícipe (también en conjunta): aportaciones + contribuciones empresariales hasta el
  # menor de (a) el 30 % de sus rendimientos netos del trabajo (art. 19, antes de la reducción
  # del art. 20) y de actividades, y (b) 1.500 € más hasta 8.500 € por contribuciones
  # empresariales. No modelados: los coeficientes de las aportaciones del trabajador al mismo
  # plan de empleo, el incremento de 4.250 € de autónomos, los 5.000 € de seguros colectivos de
  # dependencia, los excesos de años anteriores y la reducción por aportaciones al cónyuge.
  estado: confirmado
  limite_general_abs: 1500
  limite_general_pct_rend: 0.30
  incremento_contribucion_empresarial: 8500
  incremento_seguros_dependencia: 5000
  limite_aportacion_conyuge: 1000
  rentas_conyuge_maximas: 8000

reduccion_tributacion_conjunta:
  norma: "Art. 84.2 LIRPF"
  fuente: "AEAT Manual Renta 2025 — reducción por tributación conjunta"
  estado: confirmado
  biparental: 3400
  monoparental: 2150

reduccion_pensiones_compensatorias:
  norma: "Art. 55 LIRPF"
  estado: confirmado
  sin_limite_propio: true   # reduce la BIG hasta agotarla; el resto reduce la BIA

reduccion_patrimonios_protegidos:
  norma: "Art. 54 LIRPF"
  estado: provisional
  limite_por_aportante: 10000
  limite_conjunto: 24250

# -----------------------------------------------------------------------------
# 10. DEDUCCIONES DE LA CUOTA — ESTATALES (art. 68 y DDTT)
# -----------------------------------------------------------------------------
deduccion_vivienda_transitoria:
  norma: "DT 18.ª LIRPF y art. 68.1.1.º LIRPF en su redacción a 31-12-2012 (vivienda habitual adquirida antes del 1-1-2013)"
  fuente: "AEAT Manual Práctico Renta 2025, Deducción por inversión en vivienda habitual: régimen transitorio → Cantidades satisfechas y base máxima deducible; Porcentajes de deducción. Manual de Renta Web 2025, 9.1.2"
  # Base: cantidades satisfechas en el ejercicio (amortización, intereses y gastos del
  # préstamo) hasta 9.040 €; 7,5 % estatal + 7,5 % autonómico en todas las CCAA de régimen
  # común. En tributación conjunta el límite de 9.040 € es uno por declaración (art. 84 LIRPF:
  # la conjunta no amplía los límites salvo previsión expresa; Manual Práctico 2025,
  # «Tributación individual y opción por la tributación conjunta»). Pendiente: el 9 % del
  # régimen especial de Cataluña (compra antes del 30-07-2011 y otros requisitos).
  estado: confirmado
  porcentaje_estatal: 0.075
  porcentaje_autonomico_defecto: 0.075
  base_maxima: 9040
  obras_discapacidad: { base_maxima: 12080, porcentaje: 0.20 }

deduccion_alquiler_transitoria_estatal:
  norma: "DT 15ª LIRPF (contratos anteriores a 2015)"
  estado: provisional
  porcentaje: 0.1005
  base_maxima: 9040
  base_imponible_maxima: 24107.20

deduccion_donativos:
  norma: "Art. 68.3 y 69.1 LIRPF; art. 19 Ley 49/2002 (mod. RDL 6/2023)"
  fuente: "AEAT Manual Práctico Renta 2025, Deducciones por donativos → 3. Porcentajes de deducción; Límite aplicable"
  # Ley 49/2002: 80 % de los primeros 250 €, 40 % del resto (45 % si se ha donado a la misma
  # entidad en los dos años anteriores por importe igual o creciente). La BASE (no la
  # deducción) no puede superar el 10 % de la base liquidable (casillas 0500 + 0510). Se
  # aplica el 50 % en cada cuota íntegra (estatal y autonómica). No modelados: el 15 % de
  # las actividades prioritarias de mecenazgo, otras fundaciones (10 %) y partidos políticos.
  estado: confirmado
  ley49_2002:
    tramo1_limite: 250
    tramo1_porcentaje: 0.80
    resto_porcentaje: 0.40
    resto_porcentaje_recurrente: 0.45   # misma entidad >= 3 años
    limite_base_liquidable_pct: 0.10
  otras_fundaciones_porcentaje: 0.10
  cuotas_afiliacion_partidos: { porcentaje: 0.20, base_maxima: 600 }

deduccion_obras_eficiencia_energetica:
  norma: "DA 50ª LIRPF; RDL 19/2021 y prórrogas"
  estado: pendiente     # confirmar vigencia y cuantías 2025
  reduccion_demanda:   { porcentaje: 0.20, base_maxima: 5000 }
  reduccion_consumo:   { porcentaje: 0.40, base_maxima: 7500 }
  rehabilitacion_edif: { porcentaje: 0.60, base_maxima: 15000 }

deduccion_vehiculos_electricos:
  norma: "DA 58ª LIRPF; RDL 5/2023"
  estado: pendiente
  porcentaje: 0.15
  base_maxima_vehiculo: 20000
  base_maxima_punto_recarga: 4000

deduccion_ceuta_melilla:
  norma: "Art. 68.4 LIRPF"
  fuente: "Art. 68.4 LIRPF"
  estado: confirmado
  porcentaje_residentes: 0.60
  porcentaje_no_residentes: 0.50

deduccion_doble_imposicion_internacional:
  norma: "Art. 80 LIRPF"
  estado: confirmado
  metodo: "menor de (impuesto extranjero, tipo medio efectivo * renta extranjera gravada fuera)"

deduccion_obtencion_rendimientos_trabajo:
  norma: "DA 61.ª LIRPF, añadida por la DF 3.ª de la Ley 5/2025, de 24 de julio (efectos 1-1-2025)"
  fuente: "BOE-A-2025-15424 (texto de la DA 61.ª); AEAT Manual Práctico Renta 2025, Deducciones de la cuota líquida total → Deducción por obtención de rendimientos del trabajo, y sus ejemplos 1 a 3"
  # Importes, umbrales, requisito de otras rentas y orden de aplicación: literales de la
  # DA 61.ª (confirmados). Provisional por el límite: la ley dice «la parte de la suma de
  # las cuotas íntegras estatal y autonómica que proporcionalmente corresponda a los
  # rendimientos netos del trabajo» sin fijar la proporción cuando hay otras rentas. Se
  # usa (rend. íntegros del trabajo laboral − sus gastos a) a e)) / (suma de rendimientos
  # netos y ganancias positivos de las bases, cada uno menos sus gastos propios), que da el
  # 100 % sin otras rentas (ejemplo 1 de la AEAT) y sigue la indicación del ejemplo 3. En
  # tributación conjunta se aplica a cada miembro que cumpla los requisitos (sin fuente).
  estado: provisional
  importe_maximo: 340
  umbral_pleno: 16576            # rend. íntegros del trabajo <= 16.576 -> 340 €
  umbral_final: 18276            # entre ambos: 340 − 0,2 × (íntegros − 16.576); desde 18.276, 0
  coef_reduccion: 0.2
  limite_otras_rentas: 6500      # rentas distintas del trabajo laboral (excl. exentas); las pensiones cuentan
  # Solo rendimientos «derivados de la prestación efectiva de servicios correspondientes
  # a una relación laboral o estatutaria»: no las pensiones (ejemplo 2 de la AEAT).
  # Se resta de la cuota líquida total, después de la deducción por doble imposición
  # internacional (art. 80) -> cuota resultante de la autoliquidación.

