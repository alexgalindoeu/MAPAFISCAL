  fuente: "BOE-A-2006-20764; AEAT Manual Renta 2025"
  estado: confirmado
  limite_valor_transmision_acumulado: 400000
  fecha_corte_adquisicion: "1994-12-31"
  fecha_fin_computo: "1996-12-31"     # años de permanencia que exceden de 2 a esta fecha
  fecha_generacion_lineal: "2006-01-20" # parte de ganancia hasta esta fecha es la reducible
  coeficientes_por_anio_exceso:
    inmuebles: 0.1111
    acciones_cotizadas: 0.25
    resto: 0.1428

ganancias_exencion_reinversion_vivienda:
