name: Error de cálculo
description: El resultado no coincide con Renta Web, el Manual Práctico o un cálculo a mano.
title: "[Cálculo] "
labels: ["cálculo"]
body:
  - type: dropdown
    id: territorio
    attributes:
      label: Territorio
      options:
        - Andalucía
        - Aragón
        - Principado de Asturias
        - Illes Balears
        - Canarias
        - Cantabria
        - Castilla-La Mancha
        - Castilla y León
        - Cataluña
        - Extremadura
        - Galicia
        - Comunidad de Madrid
        - Región de Murcia
        - La Rioja
        - Comunitat Valenciana
        - Araba/Álava
        - Bizkaia
        - Gipuzkoa
        - Navarra
        - Varios / todos
    validations:
      required: true
  - type: textarea
    id: situacion
    attributes:
      label: Situación
      description: Ingresos, edad, familia, deducciones… Sin datos personales identificables.
      placeholder: "Asalariado de 40 años, 30.000 € brutos, 1.905 € de cotizaciones, sin hijos."
    validations:
      required: true
  - type: input
    id: obtenido
    attributes:
      label: Resultado de Mapafiscal
      placeholder: "Cuota líquida 4.939,50 €"
    validations:
      required: true
  - type: input
    id: esperado
    attributes:
      label: Resultado esperado
      placeholder: "Cuota líquida 4.900,00 € (Renta Web)"
    validations:
      required: true
  - type: textarea
    id: fuente
    attributes:
      label: Fuente
      description: Norma, página del Manual Práctico de Renta 2025 o simulación oficial que respalda el resultado esperado.
