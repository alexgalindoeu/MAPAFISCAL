name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests del motor, parámetros y empaquetado
        run: npm test
      - name: Página de validación (casos R ↔ JS y ejemplos oficiales de docs/03)
        run: node tools/generar_validacion.mjs --comprobar
      - name: Empaquetar HTML autónomo
        run: npm run empaquetar
      - name: Subir HTML empaquetado
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: mapafiscal-html
          path: dist/mapafiscal.html
          if-no-files-found: error

  e2e:
    name: E2E en el navegador (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Pruebas E2E
        run: npm run test:e2e
