name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests del motor, parámetros y empaquetado
        run: npm test
      - name: Empaquetar HTML autónomo
        run: npm run empaquetar
      - name: Subir HTML empaquetado
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: mapafiscal-html
          path: dist/mapafiscal.html
          if-no-files-found: error
