# Publica web/ en GitHub Pages. Se lanza solo en cada push a main que cambie web/ (o este
# fichero), y también a mano (Actions → Publicar web → Run workflow).
# Requiere Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Los datos del titular (aviso legal, privacidad y condiciones) no están en el repo, que
      # es público: son variables de GitHub (Settings → Secrets and variables → Actions →
      # Variables). Si falta alguna, o el correo de web/config.js es el marcador, no se publica.
      - name: Datos del titular en los textos legales
        env:
          TITULAR_NOMBRE: ${{ vars.TITULAR_NOMBRE }}
          TITULAR_NIF: ${{ vars.TITULAR_NIF }}
          TITULAR_DOMICILIO: ${{ vars.TITULAR_DOMICILIO }}
          TITULAR_REGISTRO: ${{ vars.TITULAR_REGISTRO }}
        run: node tools/rellenar_titular.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v5
