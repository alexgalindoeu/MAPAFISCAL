# Publica web/ en GitHub Pages. Se lanza solo en cada push a main que cambie web/ (o este
# fichero), y también a mano (Actions → Publicar web → Run workflow).
# Requiere Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Rellena {{CONTACTO}} con el correo de web/config.js. No se pasa ningún dato personal: lo
      # que va en `env:` sale en claro en el registro público de la ejecución. Si queda algún
      # hueco sin rellenar, o el correo es el marcador, no se publica.
      - name: Correo de contacto en los textos legales
        run: node tools/rellenar_titular.mjs
      # Añade ?v=<commit> a los CSS y JS de cada HTML de la copia que se publica, para que el
      # navegador no mezcle un index.html nuevo con un app.js viejo de su caché (Pages los
      # sirve con max-age=600). El código fuente no cambia.
      - name: Versionar CSS y JS
        run: node tools/versionar_recursos.mjs web "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v5
