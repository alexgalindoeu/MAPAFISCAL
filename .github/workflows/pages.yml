# Publica web/ en GitHub Pages. Se lanza solo en cada push a main que cambie web/ (o este
# fichero), y también a mano (Actions → Publicar web → Run workflow).
# Requiere Settings → Pages → Source: "GitHub Actions".
name: Publicar web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      # Los textos legales no llevan datos personales del titular (regla absoluta, 28-09-2026):
      # solo el nombre comercial y el correo de contacto. Si ese correo sigue siendo el
      # marcador de pruebas, esto falla y no se publica.
      - name: Correo de contacto en los textos legales
        run: node tools/rellenar_titular.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v5
