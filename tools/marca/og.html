<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapafiscal — imagen para redes (1200×630)</title>
<style>
@font-face { font-family: "Archivo"; font-weight: 600 800; font-stretch: 100% 125%; src: url("../../web/fonts/archivo-latin-var.woff2") format("woff2"); }
@font-face { font-family: "Public Sans"; font-weight: 400 700; src: url("../../web/fonts/public-sans-latin-var.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../../web/fonts/ibm-plex-mono-latin-500.woff2") format("woff2"); }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #edf1f0; color: #0d1b22; font-family: "Public Sans", sans-serif;
  background-image: linear-gradient(#d9e0de 1px, transparent 1px), linear-gradient(90deg, #d9e0de 1px, transparent 1px);
  background-size: 40px 40px; position: relative; }
.caja { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
.marca { display: flex; align-items: center; gap: 20px; }
.marca svg { width: 76px; height: 76px; }
.marca span { font-family: "Archivo"; font-stretch: 118%; font-weight: 800; font-size: 46px; letter-spacing: -.02em; }
.ante { font-family: "IBM Plex Mono"; font-weight: 500; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: #1a36a8; margin: 0 0 18px; }
h1 { font-family: "Archivo"; font-stretch: 112%; font-weight: 800; font-size: 88px; line-height: 1.02; letter-spacing: -.035em; margin: 0; max-width: 980px; }
h1 b { background: linear-gradient(transparent 58%, #ffd23f 58%); font-weight: 800; }
.pie { display: flex; justify-content: space-between; align-items: flex-end; font-size: 26px; color: #34444c; }
.pie strong { font-family: "Archivo"; font-stretch: 110%; color: #1f3fc4; font-size: 30px; }
</style>
</head>
<body>
<div class="caja">
  <div class="marca">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f3fc4"/><path fill="#fff" d="M7 10.5 13 8v15.5L7 26z"/><path fill="#ffd23f" d="M13 8l6 2.5V26l-6-2.5z"/><path fill="#fff" fill-opacity=".55" d="M19 10.5 25 8v15.5L19 26z"/></svg>
    <span>Mapafiscal</span>
  </div>
  <div>
    <p class="ante">Calculadora del IRPF · 2025 y 2026</p>
    <h1>El mismo sueldo, <b>19&nbsp;IRPF distintos</b></h1>
  </div>
  <div class="pie"><span>Calcula tu renta y compárala en los 19 territorios fiscales.</span><strong>mapafiscal.es</strong></div>
</div>
</body>
</html>
